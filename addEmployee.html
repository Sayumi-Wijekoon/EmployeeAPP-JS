<body>
     <h2 class="sub-topic">Add Employee</h2>
    <div class="mb-3 center-input">
   <label for="validationServer03" class="form-label">Full Name</label>
    <input type="text" class="form-control is-invalid" id="fullName" aria-describedby="validationServer03Feedback" required>
    <div id="validationServer03Feedback" class="invalid-feedback">
      *Required
</div>

 <div class="mb-3 center-input">
   <label for="validationServer03" class="form-label">Email Address</label>
    <input type="text" class="form-control is-invalid" id="email" aria-describedby="validationServer03Feedback" required placeholder="name@gmail.com">
    <div id="validationServer03Feedback" class="invalid-feedback">
      *Required
</div>


<div class="mb-3 center-input">
  <label for="exampleFormControlInput1" class="form-label">Phone Number</label>
  <input type="email" class="form-control" id="phoneNumber" placeholder="07########">
</div>

<div class="mb-3 center-input">
  <label for="exampleFormControlInput1" class="form-label">Gender</label>
  <input type="email" class="form-control" id="gender" placeholder="Male or Female">
</div>

<div class="mb-3 center-input">
  <label for="exampleFormControlInput1" class="form-label">Date of Joining</label>
  <input type="email" class="form-control" id="dateOfJoining" placeholder="YYYYY-MM-DD">
</div>

<div class="mb-3 center-input">
  <label for="exampleFormControlInput1" class="form-label">Department ID</label>
  <input type="email" class="form-control" id="departmentId" placeholder="">
</div>

<div class="mb-3 center-input">
  <label for="exampleFormControlInput1" class="form-label">Designation ID</label>
  <input type="email" class="form-control" id="designationId" placeholder="">
</div>

<div class="mb-3 center-input">
  <label for="exampleFormControlInput1" class="form-label">Employee Type</label>
  <input type="email" class="form-control" id="employeeType" placeholder="Permanet/Contract/Part-time">
</div>

<div class="mb-3 center-input">
  <label for="exampleFormControlInput1" class="form-label">Salary</label>
  <input type="email" class="form-control" id="salary" placeholder="">
</div>

<li class="btn btn-success">
           <button type="button" onclick="addEmployee()" class="btn btn-success">ADD </button>
                
        </li>
