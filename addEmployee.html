    <div class="mb-3 center-input">
   <label for="firstName" class="form-label">First Name</label>

      *Required
</div>

 <div class="mb-3 center-input">
   <label for="lastName" class="form-label">Last Name</label>
    <input type="text" class="form-control is-invalid" id="lastName" aria-describedby="validationServer03Feedback" required>
    <div id="validationServer03Feedback" class="invalid-feedback">
      *Required
</div>

 <div class="mb-3 center-input">
   <label for="email" class="form-label">Email Address</label>
    <input type="text" class="form-control is-invalid" id="email" aria-describedby="validationServer03Feedback" required placeholder="name@gmail.com">
    <div id="validationServer03Feedback" class="invalid-feedback">
      *Required
</div>


<div class="mb-3 center-input">
  <label for="phoneNumber" class="form-label">Phone Number</label>
  <input type="tel" class="form-control" id="phone" placeholder="07########">
</div>

<div class="mb-3 center-input">
  <label for="gender" class="form-label">Gender</label>
  <input type="text" class="form-control" id="gender" placeholder="Male or Female">
</div>

<div class="mb-3 center-input">
  <label for="dateOfJoining" class="form-label">Date & Time of Joining</label>
  <input type="datetime-local" class="form-control" id="dateOfJoining" placeholder="YYYY-MM-DDTHH:MM">
</div>

<div class="mb-3 center-input">
  <label for="departmentId" class="form-label">Department ID</label>
  <input type="number" class="form-control" id="departmentId" placeholder="1">
</div>

<div class="mb-3 center-input">
  <label for="designationId" class="form-label">Designation ID</label>
  <input type="number" class="form-control" id="designationId" placeholder="1">
</div>

<div class="mb-3 center-input">
  <label for="employeeType" class="form-label">Employee Type</label>
  <input type="text" class="form-control" id="employeeType" placeholder="">
</div>

<div class="mb-3 center-input">
  <label for="salary" class="form-label">Salary</label>
  <input type="number" class="form-control" id="salary" placeholder="">
</div>
